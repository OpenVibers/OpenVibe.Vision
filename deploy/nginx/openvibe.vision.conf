## ═══════════════════════════════════════════════════════════════
## openvibe.vision — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.vision.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5130, systemd unit openvibe-vision) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in, the API and the forms, and compresses
## text.
##
## No proxy_cache: the app decides cacheability per response (public for the public pages; private, no-store for
## anything drawn for a signed-in person or a saved answer). Never log request bodies or image bytes here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=vision_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vision_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=vision_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.vision www.openvibe.vision;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.vision$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.vision;

    ssl_certificate     /etc/letsencrypt/live/openvibe.vision/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.vision/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.vision$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.vision;

    ssl_certificate     /etc/letsencrypt/live/openvibe.vision/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.vision/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.vision.access.log;
    error_log  /var/log/nginx/openvibe.vision.error.log;

    # Images are capped at 8 MB by the app (16 MB as a base64 JSON body) and HTML at 1 MB; leave room for the headers.
    client_max_body_size 16m;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=vision_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5130;
    }

    location /auth/ {
        limit_req zone=vision_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5130;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=vision_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5130;
    }

    # ── Forms: ask, OCR, compare and the UI check ───────────
    location ~ ^/(ask|ocr|compare|ui-check)/?$ {
        limit_req zone=vision_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5130;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5130/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' account delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5130/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5130;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
